name: 'Busbar Metadata Pull'
description: 'Retrieve Salesforce metadata into the repo as a source-format tree (or MDAPI zip)'
author: 'busbar.agency'
branding:
  icon: 'download-cloud'
  color: 'blue'

inputs:
  sf-access-token:
    description: 'Salesforce session access token (provide via secrets).'
    required: true
  sf-instance-url:
    description: 'Salesforce instance URL, e.g. https://yourdomain.my.salesforce.com'
    required: true

  target:
    description: 'Where the retrieved metadata is written, relative to the repo root.'
    required: false
    default: 'force-app/main/default'

  format:
    description: 'Output format. "source" decomposes via metadata-etl; "mdapi" writes the raw retrieved zip.'
    required: false
    default: 'source'

  package-xml:
    description: 'Path to a package.xml manifest. If omitted, types/components/since drive the retrieve scope.'
    required: false
    default: ''
  types:
    description: 'Comma-separated metadata type names to retrieve (e.g. CustomObject,ApexClass,Flow).'
    required: false
    default: ''
  components:
    description: 'Comma-separated Type:Name component refs (e.g. CustomObject:Account,ApexClass:OrderUtil).'
    required: false
    default: ''
  since:
    description: 'Only include components last modified at or after this ISO-8601 timestamp.'
    required: false
    default: ''

  api-version:
    description: 'Metadata API version to target. Empty = use the org default.'
    required: false
    default: ''

  emit-manifest:
    description: 'Write the resolved package.xml the retrieve actually used into the target.'
    required: false
    default: 'true'
  manifest-path:
    description: 'Relative-to-target filename for the emitted manifest.'
    required: false
    default: 'package.xml'

  commit:
    description: 'Commit retrieved metadata back to the current branch.'
    required: false
    default: 'true'
  commit-message:
    description: 'Commit message used when commit=true.'
    required: false
    default: 'chore(metadata): refresh Salesforce metadata'
  git-user-name:
    description: 'git user.name for the commit.'
    required: false
    default: 'busbar-bot'
  git-user-email:
    description: 'git user.email for the commit.'
    required: false
    default: 'bot@busbar.agency'

  comment-pr:
    description: 'Post a summary comment on pull_request events.'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Upload retrieved metadata as a workflow artifact.'
    required: false
    default: 'false'
  artifact-name:
    description: 'Artifact name when upload-artifact=true.'
    required: false
    default: 'metadata'

  version:
    description: 'busbar-sf release tag to download (e.g. v0.4.2). "latest" resolves the most recent release.'
    required: false
    default: 'latest'
  binary-repo:
    description: 'GitHub repo that publishes the busbar-sf binary releases.'
    required: false
    default: 'busbar-actions/actions-dist'

outputs:
  changed:
    description: '"true" if the pull produced changes vs the prior tree.'
    value: ${{ steps.diff.outputs.changed }}
  target-path:
    description: 'Path where metadata was written (echoes the input).'
    value: ${{ inputs.target }}
  manifest-path:
    description: 'Path to the emitted manifest (empty if emit-manifest=false).'
    value: ${{ steps.pull.outputs.manifest-path }}
  component-count:
    description: 'Number of components retrieved.'
    value: ${{ steps.pull.outputs.component-count }}

runs:
  using: 'composite'
  steps:
    - name: Resolve release tag
      id: tag
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.version }}" == "latest" ]]; then
          tag=$(gh release view --repo "${{ inputs.binary-repo }}" --json tagName -q .tagName)
        else
          tag="${{ inputs.version }}"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Determine asset name
      id: asset
      shell: bash
      run: |
        set -euo pipefail
        os="${{ runner.os }}"
        arch="${{ runner.arch }}"
        case "$os-$arch" in
          Linux-X64)   name="busbar-sf-x86_64-unknown-linux-gnu" ;;
          Linux-ARM64) name="busbar-sf-aarch64-unknown-linux-gnu" ;;
          macOS-X64)   name="busbar-sf-x86_64-apple-darwin" ;;
          macOS-ARM64) name="busbar-sf-aarch64-apple-darwin" ;;
          Windows-X64) name="busbar-sf-x86_64-pc-windows-msvc.exe" ;;
          *) echo "::error::Unsupported runner: $os-$arch"; exit 1 ;;
        esac
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Download busbar-sf binary
      shell: bash
      run: |
        set -euo pipefail
        bin_dir="${RUNNER_TEMP}/busbar-sf"
        mkdir -p "$bin_dir"
        gh release download "${{ steps.tag.outputs.tag }}" \
          --repo "${{ inputs.binary-repo }}" \
          --pattern "${{ steps.asset.outputs.name }}" \
          --dir "$bin_dir"
        bin_path="$bin_dir/${{ steps.asset.outputs.name }}"
        chmod +x "$bin_path"
        echo "$bin_dir" >> "$GITHUB_PATH"
        if [[ "$bin_path" != "$bin_dir/busbar-sf" && "$bin_path" != "$bin_dir/busbar-sf.exe" ]]; then
          ext=""
          [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          ln -sf "$bin_path" "$bin_dir/busbar-sf$ext"
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Pull metadata
      id: pull
      shell: bash
      env:
        SF_ACCESS_TOKEN: ${{ inputs.sf-access-token }}
        SF_INSTANCE_URL: ${{ inputs.sf-instance-url }}
      run: |
        set -euo pipefail

        args=(metadata pull
          --target "${{ inputs.target }}"
          --format "${{ inputs.format }}")

        if [[ -n "${{ inputs.package-xml }}" ]]; then
          args+=(--package-xml "${{ inputs.package-xml }}")
        fi
        if [[ -n "${{ inputs.types }}" ]]; then
          args+=(--types "${{ inputs.types }}")
        fi
        if [[ -n "${{ inputs.components }}" ]]; then
          args+=(--components "${{ inputs.components }}")
        fi
        if [[ -n "${{ inputs.since }}" ]]; then
          args+=(--since "${{ inputs.since }}")
        fi
        if [[ -n "${{ inputs.api-version }}" ]]; then
          args+=(--api-version "${{ inputs.api-version }}")
        fi

        manifest_out=""
        if [[ "${{ inputs.emit-manifest }}" == "true" ]]; then
          manifest_out="${{ inputs.target }}/${{ inputs.manifest-path }}"
          args+=(--emit-manifest "$manifest_out")
        fi

        mkdir -p "${{ inputs.target }}"
        log="${RUNNER_TEMP}/busbar-sf-metadata.log"
        busbar-sf "${args[@]}" --json 2>&1 | tee "$log"

        # The subcommand prints a final JSON summary line: {"component_count": N, ...}
        # Parse the last JSON object on stdout for counts.
        count=$(grep -oE '"component_count"[[:space:]]*:[[:space:]]*[0-9]+' "$log" | grep -oE '[0-9]+' | tail -n1 || true)
        echo "component-count=${count:-0}" >> "$GITHUB_OUTPUT"
        echo "manifest-path=$manifest_out" >> "$GITHUB_OUTPUT"

    - name: Detect changes
      id: diff
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "$(git status --porcelain -- "${{ inputs.target }}")" ]]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload artifact
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.target }}
        if-no-files-found: warn

    - name: Post PR comment
      if: inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COUNT: ${{ steps.pull.outputs.component-count }}
        CHANGED: ${{ steps.diff.outputs.changed }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        if [[ "$CHANGED" == "false" ]]; then
          body=$'### ⬇️ busbar metadata-pull\n\nNo changes against the current tree.'
        else
          # Show top changed metadata types from git status.
          types=$(git status --porcelain -- "$TARGET" \
            | awk '{print $NF}' \
            | sed -E "s|^$TARGET/||" \
            | awk -F/ '{print $1}' \
            | sort | uniq -c | sort -rn | head -10 \
            | awk '{printf "| %s | %d |\n", $2, $1}')

          body="### ⬇️ busbar metadata-pull

Retrieved **$COUNT components** into \`$TARGET\` — diff vs current tree shown below.

| Type / Folder | Changed files |
|---|---:|
$types"
        fi
        gh pr comment "${{ github.event.pull_request.number }}" --body "$body"

    - name: Commit changes
      if: inputs.commit == 'true' && steps.diff.outputs.changed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git config user.name  "${{ inputs.git-user-name }}"
        git config user.email "${{ inputs.git-user-email }}"
        git add -- "${{ inputs.target }}"
        git commit -m "${{ inputs.commit-message }}"
        git push
