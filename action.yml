name: 'Busbar Metadata Pull'
description: 'Retrieve Salesforce metadata into the repo as a source-format tree (or MDAPI zip)'
author: 'busbar.agency'
branding:
  icon: 'download-cloud'
  color: 'blue'

inputs:
  target-instance:
    description: |
      Instance URL of the Busbar-equipped Salesforce org to authenticate to,
      e.g. https://yourdomain.my.salesforce.com. This is the DEFAULT auth path:
      the binary mints its OWN short-lived token in-process from the runner's
      GitHub OIDC id-token (no SF token ever touches the workflow). Requires the
      caller job to grant `permissions: id-token: write`.
    required: false
    default: ''

  target:
    description: 'Where the retrieved metadata is written, relative to the repo root.'
    required: false
    default: 'force-app/main/default'

  package-xml:
    description: 'Path to a package.xml manifest. If omitted, types/components drive the retrieve scope.'
    required: false
    default: ''
  types:
    description: 'Comma-separated metadata type names to retrieve (e.g. CustomObject,ApexClass,Flow).'
    required: false
    default: ''
  components:
    description: 'Comma-separated Type:Name component refs (e.g. CustomObject:Account,ApexClass:OrderUtil).'
    required: false
    default: ''

  api-version:
    description: 'Metadata API version to target. Empty = use the org default.'
    required: false
    default: ''

  emit-manifest:
    description: 'Write the resolved package.xml the retrieve actually used into the target.'
    required: false
    default: 'true'
  manifest-path:
    description: 'Relative-to-target filename for the emitted manifest.'
    required: false
    default: 'package.xml'

  commit:
    description: 'Commit retrieved metadata back to the current branch.'
    required: false
    default: 'true'
  commit-message:
    description: 'Commit message used when commit=true.'
    required: false
    default: 'chore(metadata): refresh Salesforce metadata'
  git-user-name:
    description: 'git user.name for the commit.'
    required: false
    default: 'busbar-bot'
  git-user-email:
    description: 'git user.email for the commit.'
    required: false
    default: 'bot@busbar.agency'

  comment-pr:
    description: 'Post a summary comment on pull_request events.'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Upload retrieved metadata as a workflow artifact.'
    required: false
    default: 'false'
  artifact-name:
    description: 'Artifact name when upload-artifact=true.'
    required: false
    default: 'metadata'
  version:
    description: 'Release tag of the sf-metadata-retrieve binary. Falls back to env.BUSBAR_ACTION_VERSION, then "latest".'
    required: false
    default: ''
  binary-repo:
    description: 'GitHub repo hosting prebuilt binary releases. Falls back to env.BUSBAR_ACTION_REPO, then busbar-actions/actions-dist.'
    required: false
    default: ''

outputs:
  changed:
    description: '"true" if the pull produced changes vs the prior tree.'
    value: ${{ steps.pull.outputs.changed }}
  target-path:
    description: 'Path where metadata was written (echoes the input).'
    value: ${{ inputs.target }}
  manifest-path:
    description: 'Path to the emitted manifest (empty if emit-manifest=false).'
    value: ${{ steps.pull.outputs.manifest-path }}
  component-count:
    description: 'Number of components retrieved.'
    value: ${{ steps.pull.outputs.component-count }}
  file-count:
    description: 'Number of files written to the target tree.'
    value: ${{ steps.pull.outputs.file-count }}

# The binary owns all logic and UX: it reads its inputs from INPUT_*, retrieves
# the metadata, writes the target tree, computes component/file counts, writes
# GITHUB_OUTPUT, the step summary, an annotation and the PR-comment body, and
# commits the retrieved tree back (emitting `changed`). This action only installs
# it, passes inputs through, and wires the two GitHub-native publish steps
# (artifact upload, PR comment).
runs:
  using: 'composite'
  steps:
    - name: Install the sf-metadata-retrieve binary from actions-dist
      uses: busbar-actions/setup@main
      with:
        binary: sf-metadata-retrieve
        version: ${{ inputs.version || env.BUSBAR_ACTION_VERSION || 'latest' }}
        binary-repo: ${{ inputs.binary-repo || env.BUSBAR_ACTION_REPO || 'busbar-actions/actions-dist' }}

    - name: Retrieve the requested metadata from the Busbar-equipped org into the source tree
      id: pull
      shell: bash
      env:
        # ---- Auth (busbar-auth session_from_env) ----
        # DEFAULT: self-mint via GitHub OIDC. SF_INSTANCE_URL = the Busbar-equipped
        # org's instance URL (from target-instance, or the sf-instance-url override).
        # SF_ACCESS_TOKEN is set ONLY when the caller supplies the optional
        # local-dev override; when it is absent, busbar-auth performs the in-process
        # OIDC token exchange. NO Salesforce token is ever written to GITHUB_ENV or
        # handed off between steps.
        SF_INSTANCE_URL: ${{ inputs.target-instance || env.SF_INSTANCE_URL }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_PACKAGE_XML: ${{ inputs.package-xml }}
        INPUT_TYPES: ${{ inputs.types }}
        INPUT_COMPONENTS: ${{ inputs.components }}
        INPUT_API_VERSION: ${{ inputs.api-version }}
        INPUT_EMIT_MANIFEST: ${{ inputs.emit-manifest }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest-path }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        INPUT_COMMENT_OUTPUT: ${{ runner.temp }}/metadata-comment.md
      run: |
        set -euo pipefail
        echo "Retrieving metadata from ${SF_INSTANCE_URL} into ${INPUT_TARGET} (package-xml='${INPUT_PACKAGE_XML}' types='${INPUT_TYPES}' components='${INPUT_COMPONENTS}')"
        sf-metadata-retrieve

    - name: Upload the retrieved metadata source tree as a workflow artifact
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.target }}
        # `target` is often a dot-dir (e.g. .test-metadata); upload-artifact@v4
        # excludes hidden files by default, so opt in to keep the retrieved tree.
        include-hidden-files: true
        if-no-files-found: error

    - name: Post the metadata-retrieve summary as a PR comment
      if: inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        body_file="${RUNNER_TEMP}/metadata-comment.md"
        echo "Posting the metadata-retrieve summary from ${body_file} as a comment on PR #${PR_NUMBER}"
        gh pr comment "$PR_NUMBER" --body-file "$body_file"
